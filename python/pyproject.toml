[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tuvx_photolysis"
version = "0.1.0"
description = "JAX port of the TUV-x actinic-flux and photolysis-rate-constant calculation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tuvx_photolysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
